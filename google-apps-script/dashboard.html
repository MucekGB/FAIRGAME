<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCK Progress Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0c;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  h1 {
    font-size: 15px;
    font-weight: 800;
    color: #ffcf70;
    letter-spacing: .6px;
    margin-bottom: 16px;
    text-transform: uppercase;
    text-align: center;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 680px;
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 10px;
  }

  .card-title {
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    color: #ffcf70;
    letter-spacing: .5px;
    margin-bottom: 10px;
  }

  .rows { display: grid; gap: 6px; }

  .row {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 6px;
    align-items: center;
  }

  .label {
    font-size: 10px;
    font-weight: 700;
    color: rgba(255,255,255,.65);
    text-transform: uppercase;
  }

  .value {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    user-select: none;
    transition: background .14s, border-color .14s;
  }

  .value:hover {
    background: rgba(255,166,0,.12);
    border-color: rgba(255,166,0,.55);
  }

  .value.all-row {
    background: rgba(255,166,0,.06);
    border-color: rgba(255,166,0,.18);
    color: #ffd27a;
  }

  .value.all-row:hover {
    background: rgba(255,166,0,.18);
    border-color: rgba(255,166,0,.7);
  }

  .footer {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 680px;
    gap: 10px;
  }

  .status {
    font-size: 11px;
    color: rgba(255,255,255,.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .refresh-btn {
    flex: 0 0 auto;
    height: 28px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: background .14s, border-color .14s;
  }

  .refresh-btn:hover {
    background: rgba(255,166,0,.14);
    border-color: rgba(255,166,0,.6);
  }

  .toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,153,0,.14);
    border: 1px solid rgba(255,153,0,.7);
    color: #fff;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    opacity: 0;
    transition: opacity .16s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 9999;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1>MCK Progress</h1>

<div class="grid">
  <!-- PACK -->
  <div class="card">
    <div class="card-title">PACK</div>
    <div class="rows">
      <div class="row"><div class="label">Today</div> <div class="value" data-key="today:pack">—</div></div>
      <div class="row"><div class="label">Yest</div>  <div class="value" data-key="yesterday:pack">—</div></div>
      <div class="row"><div class="label">DBY</div>   <div class="value" data-key="dby:pack">—</div></div>
      <div class="row"><div class="label">All</div>   <div class="value all-row" data-key="all:pack">—</div></div>
    </div>
  </div>

  <!-- BPP -->
  <div class="card">
    <div class="card-title">BPP</div>
    <div class="rows">
      <div class="row"><div class="label">Today</div> <div class="value" data-key="today:bpp">—</div></div>
      <div class="row"><div class="label">Yest</div>  <div class="value" data-key="yesterday:bpp">—</div></div>
      <div class="row"><div class="label">DBY</div>   <div class="value" data-key="dby:bpp">—</div></div>
      <div class="row"><div class="label">All</div>   <div class="value all-row" data-key="all:bpp">—</div></div>
    </div>
  </div>

  <!-- PICK -->
  <div class="card">
    <div class="card-title">PICK</div>
    <div class="rows">
      <div class="row"><div class="label">Today</div> <div class="value" data-key="today:pick">—</div></div>
      <div class="row"><div class="label">Yest</div>  <div class="value" data-key="yesterday:pick">—</div></div>
      <div class="row"><div class="label">DBY</div>   <div class="value" data-key="dby:pick">—</div></div>
      <div class="row"><div class="label">All</div>   <div class="value all-row" data-key="all:pick">—</div></div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="status" id="status">Ładowanie danych…</div>
  <button class="refresh-btn" id="refreshBtn">Odśwież</button>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── The Apps Script URL is injected at serve-time by Code.gs
  // When running inside Apps Script the page is served from the same origin,
  // so we can use a relative URL with ?action=data.
  const DATA_URL = '<?= ScriptApp.getService().getUrl() ?>?action=data';

  // ── Polling interval (ms) — default 60 seconds
  const POLL_MS = 60000;

  let pollTimer = null;
  let lastUpdatedAt = null;

  // ── Helpers ────────────────────────────────────────────────────────────────

  function parseNumber(v) {
    return parseInt(String(v || '0').replace(/,/g, ''), 10) || 0;
  }

  function sumValues(a, b, c) {
    return (parseNumber(a) + parseNumber(b) + parseNumber(c)).toLocaleString();
  }

  function setText(key, value) {
    const el = document.querySelector('[data-key="' + key + '"]');
    if (el) el.textContent = value || '0';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    clearTimeout(t._t);
    t._t = setTimeout(() => { t.style.opacity = '0'; }, 1400);
  }

  function copyToClipboard(text) {
    const clean = String(text).replace(/,/g, '');
    if (!clean || clean === '0') return;
    try {
      navigator.clipboard.writeText(clean).then(() => showToast('Skopiowano: ' + clean));
    } catch (_) {
      showToast('Kliknij ponownie (clipboard niedostępny)');
    }
  }

  // ── Render ─────────────────────────────────────────────────────────────────

  function render(data) {
    const types = ['pack', 'bpp', 'pick'];
    const groups = ['today', 'yesterday', 'dby'];

    for (const g of groups) {
      for (const t of types) {
        setText(g + ':' + t, (data[g] && data[g][t]) || '0');
      }
    }

    for (const t of types) {
      const all = sumValues(
        data.today && data.today[t],
        data.yesterday && data.yesterday[t],
        data.dby && data.dby[t]
      );
      setText('all:' + t, all);
    }

    const d = new Date(data.updatedAt);
    const timeStr = isNaN(d) ? '?' : d.toLocaleTimeString('pl-PL');
    document.getElementById('status').textContent = 'Ostatnia aktualizacja: ' + timeStr;

    if (data.updatedAt && data.updatedAt !== lastUpdatedAt) {
      lastUpdatedAt = data.updatedAt;
    }
  }

  // ── Fetch ──────────────────────────────────────────────────────────────────

  async function fetchData(showFeedback) {
    try {
      const res = await fetch(DATA_URL, { cache: 'no-store' });
      const json = await res.json();
      if (!json.ok) {
        document.getElementById('status').textContent = 'Brak danych — uruchom skrypt i kliknij Refresh.';
        return;
      }
      render(json.data);
      if (showFeedback) showToast('Odświeżono');
    } catch (err) {
      document.getElementById('status').textContent = 'Błąd pobierania: ' + err.message;
    }
  }

  // ── Polling ────────────────────────────────────────────────────────────────

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(() => fetchData(false), POLL_MS);
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ── Events ─────────────────────────────────────────────────────────────────

  document.getElementById('refreshBtn').addEventListener('click', () => fetchData(true));

  document.querySelectorAll('.value').forEach(el => {
    el.addEventListener('click', () => copyToClipboard(el.textContent));
  });

  // ── Boot ───────────────────────────────────────────────────────────────────

  fetchData(false);
  startPolling();
</script>
</body>
</html>
